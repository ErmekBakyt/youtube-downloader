# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push: 
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Publish
      run: dotnet publish ./get-video.sln --configuration Release --output src/Web/bin/Release/net10.0/publish/ --no-restore 
    - name: LS0
      run: |
          ls
    - name: CD
      run: cd src
    - name: LS
      run: |
          ls
          cd src/Web
          ls
          cd bin
          ls
          cd Release
          ls
          cd net10.0
          ls
          cd publish
          ls
    - name: Publish to Registry
      uses: mr-smithers-excellent/docker-build-push@v6
      with:
        context: ./src/Web/
        image: ermek92/getvideo
        tags: latest
        registry: docker.io
        dockerfile: ./src/Web/Dockerfile
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }} 
        
    - name: Pull and Deploy (docker compose)
      uses: appleboy/ssh-action@master
      with:
        host: 62.171.188.96
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        script: |
          set -euo pipefail

          cd /opt/get-video

          echo "== Docker login =="
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          # compose servis adı (docker-compose.yml'deki service key)
          SERVICE="app"

          echo "== Pull latest image for $SERVICE =="
          docker compose pull $SERVICE
          
          echo "== Remove legacy container name conflict (if any) =="
          docker rm -f get-video 2>/dev/null || true
          
          echo "== Recreate only $SERVICE (nginx dokunma) =="
          docker compose up -d --no-deps $SERVICE

          echo "== Cleanup unused images =="
          docker image prune -f

          echo "== Status =="
          docker compose ps
          docker logs --tail 50 get-video || true
