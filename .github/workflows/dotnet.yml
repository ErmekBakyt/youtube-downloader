# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push: 
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Publish
      run: dotnet publish ./get-video.sln --configuration Release --output src/Web/bin/Release/net10.0/publish/ --no-restore 
    - name: LS0
      run: |
          ls
    - name: CD
      run: cd src
    - name: LS
      run: |
          ls
          cd src/Web
          ls
          cd bin
          ls
          cd Release
          ls
          cd net10.0
          ls
          cd publish
          ls
    - name: Publish to Registry
      uses: mr-smithers-excellent/docker-build-push@v6
      with:
        context: ./src/Web/
        image: ermek92/getvideo
        tags: latest
        registry: docker.io
        dockerfile: ./src/Web/Dockerfile
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }} 
        
    - name: Pull and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: 62.171.188.96
        username: root
        password: ${{secrets.ACTION_PRIVATE_KEY}}
        script: |
            set -euo pipefail

            APP_NAME="get-video"
            IMAGE="ermek92/getvideo:latest"
            PORT_HOST=8080
            PORT_CONT=8080
            NETWORK="get-video"

            echo "== Docker login =="
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "== Pull image =="
            docker pull "$IMAGE"

            echo "== Ensure network exists =="
            docker network inspect "$NETWORK" >/dev/null 2>&1 || docker network create "$NETWORK"

            echo "== Stop & remove old container if exists =="
            docker rm -f "$APP_NAME" >/dev/null 2>&1 || true

            echo "== Run new container =="
            docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              --network "$NETWORK" \
              -p "${PORT_HOST}:${PORT_CONT}" \
              "$IMAGE"

            echo "== Cleanup unused images =="
            docker image prune -f

            echo "== Status =="
            docker ps --filter "name=$APP_NAME"
            docker logs --tail 30 "$APP_NAME" || true
