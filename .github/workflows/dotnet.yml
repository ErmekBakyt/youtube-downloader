name: .NET (Host test)

on:
  push:
    branches: ["master"]

jobs:
  host_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish (linux-x64)
        run: dotnet publish ./get-video.sln -c Release -r linux-x64 --self-contained false -o publish

      - name: Upload publish to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 62.171.188.96
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          source: "publish/*"
          target: "/opt/get-video/hosttest/publish"
          overwrite: true

      - name: Run app on port 8081 (temporary, detached)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 62.171.188.96
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -euo pipefail

            APP_DIR="/opt/get-video/hosttest/publish"
            APP_DLL="${APP_DIR}/Web.dll"
            LOG="/opt/get-video/hosttest/hosttest.log"
            PORT=8081

            echo "== Verify files on server =="
            ls -la "${APP_DIR}" | head -n 50

            if [ ! -f "${APP_DLL}" ]; then
              echo "ERROR: ${APP_DLL} not found. Check publish output name (Web.dll) and SCP step."
              exit 1
            fi

            echo "== Kill old test process (if any) =="
            pkill -f "${APP_DLL}" || true

            echo "== Start new process detached =="
            setsid /opt/dotnet/dotnet "${APP_DLL}" --urls "http://0.0.0.0:${PORT}" > "${LOG}" 2>&1 < /dev/null &

            sleep 2

            echo "== Health check =="
            if ! curl -I "http://127.0.0.1:${PORT}/" | head -n 20; then
              echo "== App log tail =="
              tail -n 120 "${LOG}" || true
              exit 1
            fi

            echo "✅ Host test is running: http://SERVER_IP:${PORT}"
            echo "Log: ${LOG}"
