# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push: 
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Publish
      run: dotnet publish ./get-video.sln --configuration Release --output src/Web/bin/Release/net10.0/publish/ --no-restore 
    - name: CD
      run: cd Web
    - name: LS
      run: |
          ls
          cd Web
          ls
          cd bin
          ls
          cd Release
          ls
          cd net10.0
          ls
          cd publish
          ls
    - name: Publish to Registry
      uses: mr-smithers-excellent/docker-build-push@v6
      with:
        context: ./src/Web/
        image: ermek92/getvideo
        tags: latest
        registry: docker.io
        dockerfile: ./src/Web/Dockerfile
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }} 
        
    - name: Pull and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: 62.171.188.96
        username: root
        key: ${{secrets.ACTION_PRIVATE_KEY}}
        envs: GITHUB_SHA
        script: |
          docker login  --username=ermek92 --password=ermek1212
          docker pull ermek92/getvideo:latest
          docker stop get-video
          docker rm get-video
          docker run -p 8080:8080 -d --network get-video --name get-video ermek92/getvideo:latest
